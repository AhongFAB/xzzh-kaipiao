<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="开票建议匹配工具 - 智能匹配销项进项品名，提供开票建议">
    <meta name="theme-color" content="#0891b2">
    <title>开票建议匹配工具</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #0891b2; --primary-dark: #0e7490; --primary-light: #06b6d4;
            --secondary: #10b981; --secondary-dark: #059669;
            --bg-gradient: linear-gradient(135deg, #f0fdfa 0%, #ecfdf5 100%);
            --card-shadow: 0 4px 20px rgba(8,145,178,0.15);
            --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
            --text-primary: #134e4a; --border-radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC','Microsoft YaHei',-apple-system,sans-serif; background: var(--bg-gradient); min-height: 100vh; color: var(--text-primary); line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 30px; border-radius: var(--border-radius); margin-bottom: 24px; box-shadow: var(--card-shadow); }
        header h1 { font-size: 28px; margin-bottom: 8px; }
        header p { opacity: 0.9; font-size: 14px; }
        .upload-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .upload-card { background: white; border-radius: var(--border-radius); padding: 24px; box-shadow: var(--card-shadow); border: 2px dashed transparent; transition: all 0.3s; }
        .upload-card.dragover { border-color: var(--primary); background: #f0fdfa; }
        .upload-card h3 { color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-size: 16px; }
        .upload-zone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: #f8fafc; }
        .upload-zone:hover { border-color: var(--primary); background: #f0fdfa; }
        .upload-zone .icon { font-size: 48px; margin-bottom: 12px; }
        .upload-zone .hint { color: #64748b; font-size: 14px; }
        .file-info { margin-top: 12px; padding: 12px; background: #f0fdfa; border-radius: 8px; display: none; }
        .file-info.show { display: block; }
        .file-info .name { font-weight: 600; color: var(--primary-dark); word-break: break-all; }
        .file-info .meta { font-size: 12px; color: #64748b; margin-top: 4px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(8,145,178,0.4); }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-danger { background: #fef2f2; color: var(--danger); }
        .btn-danger:hover { background: #fee2e2; }
        .btn-success { background: #ecfdf5; color: var(--success); }
        .btn-success:hover { background: #d1fae5; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .action-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .tabs { display: flex; gap: 4px; background: white; padding: 6px; border-radius: var(--border-radius); box-shadow: var(--card-shadow); margin-bottom: 20px; overflow-x: auto; flex-wrap: wrap; }
        .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: #64748b; transition: all 0.2s; white-space: nowrap; }
        .tab-btn:hover { background: #f1f5f9; color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-btn .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; background: rgba(255,255,255,0.3); }
        .tab-btn:not(.active) .badge { background: #e2e8f0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; border-radius: var(--border-radius); padding: 24px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
        .card-title { font-size: 16px; font-weight: 600; color: var(--primary-dark); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: var(--border-radius); padding: 20px; box-shadow: var(--card-shadow); text-align: center; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); }
        .stat-card .label { font-size: 13px; color: #64748b; margin-top: 4px; }
        .stat-card.success .value { color: var(--success); }
        .stat-card.warning .value { color: var(--warning); }
        .stat-card.danger .value { color: var(--danger); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; font-weight: 500; position: sticky; top: 0; }
        tr:hover { background: #f8fafc; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .tag-success { background: #d1fae5; color: #065f46; }
        .tag-warning { background: #fef3c7; color: #92400e; }
        .tag-danger { background: #fee2e2; color: #991b1b; }
        .tag-info { background: #dbeafe; color: #1e40af; }
        .scrollable-table { max-height: 70vh; overflow: auto; border-radius: 8px; }
        .money { font-family: 'SF Mono','Monaco','Consolas',monospace; text-align: right; white-space: nowrap; }
        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .alias-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f0fdfa; border-radius: 8px; margin-bottom: 8px; }
        .alias-item .arrow { font-size: 20px; color: var(--primary); }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; color: white; font-size: 14px; z-index: 9999; animation: slideIn 0.3s ease; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: var(--primary); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        footer { text-align: center; padding: 24px; color: #94a3b8; font-size: 12px; }
        .highlight-row { background: #fffbeb !important; }
        .success-row { background: #f0fdf4 !important; }
        .error-row { background: #fef2f2 !important; }
        @media (max-width: 768px) {
            .upload-section { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>📋 开票建议匹配工具</h1>
        <p>智能匹配销项进项品名，自动计算进项缺口，生成开票建议</p>
    </header>

    <div class="upload-section">
        <div class="upload-card" id="kaipiaoCard">
            <h3>📤 待开票清单</h3>
            <div class="upload-zone" id="kaipiaoZone">
                <div class="icon">📄</div>
                <div>点击或拖拽上传</div>
                <div class="hint">支持 .xlsx / .xls / .csv</div>
            </div>
            <input type="file" id="kaipiaoInput" accept=".xlsx,.xls,.csv" style="display:none">
            <div class="file-info" id="kaipiaoInfo">
                <div class="name" id="kaipiaoName"></div>
                <div class="meta" id="kaipiaoMeta"></div>
            </div>
        </div>
        <div class="upload-card" id="jinxiaoCard">
            <h3>📥 进项发票明细</h3>
            <div class="upload-zone" id="jinxiaoZone">
                <div class="icon">📄</div>
                <div>点击或拖拽上传</div>
                <div class="hint">支持 .xlsx / .xls / .csv</div>
            </div>
            <input type="file" id="jinxiaoInput" accept=".xlsx,.xls,.csv" style="display:none">
            <div class="file-info" id="jinxiaoInfo">
                <div class="name" id="jinxiaoName"></div>
                <div class="meta" id="jinxiaoMeta"></div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-primary" id="analyzeBtn" onclick="runAnalysis()" disabled>
            <span>🔍</span> 开始分析
        </button>
        <button class="btn btn-secondary" onclick="clearAll()">
            <span>🗑️</span> 清空数据
        </button>
    </div>

    <div id="resultsSection" style="display:none">
        <div class="tabs">
            <button class="tab-btn" onclick="switchTab(0)">📊 匹配概览</button>
            <button class="tab-btn" onclick="switchTab(1)">🟢 高可信<span class="badge" id="highBadge"></span></button>
            <button class="tab-btn" onclick="switchTab(2)">🟡 中可信<span class="badge" id="mediumBadge"></span></button>
            <button class="tab-btn" onclick="switchTab(3)">🔴 低可信<span class="badge" id="lowBadge"></span></button>
            <button class="tab-btn" onclick="switchTab(4)">🤔 待确认<span class="badge" id="suggestBadge"></span></button>
            <button class="tab-btn" onclick="switchTab(5)">📦 进项余额</button>
            <button class="tab-btn" onclick="switchTab(6)">🔗 别名表</button>
            <button class="tab-btn" onclick="switchTab(7)">📋 开票建议</button>
        </div>
        <div class="action-bar" style="margin-bottom:16px">
            <button class="btn btn-success btn-sm" onclick="exportCurrentTab()">📥 导出当前页</button>
            <button class="btn btn-primary btn-sm" onclick="exportAll()">📥 导出全部</button>
        </div>
        <div class="tab-content" id="tab0"></div>
        <div class="tab-content" id="tab1"></div>
        <div class="tab-content" id="tab2"></div>
        <div class="tab-content" id="tab3"></div>
        <div class="tab-content" id="tab4"></div>
        <div class="tab-content" id="tab5"></div>
        <div class="tab-content" id="tab6"></div>
        <div class="tab-content" id="tab7"></div>
    </div>
</div>
<footer>© 2026 开票建议匹配工具 | 开发者：张洪杰 | 侵权必究</footer>

<script>
    let kaipiaoData = [];
    let jinxiaoData = [];
    let analysisResult = null;
    let currentTab = 0;
    let aliasMap = {};
    try { aliasMap = JSON.parse(localStorage.getItem('kaipiao_alias_map') || '{}'); } catch(e) { aliasMap = {}; }

    function formatMoney(n) {
        if (n === null || n === undefined || isNaN(n)) return '0.00';
        return Math.abs(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showToast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // ========== 文件上传 ==========
    function setupUpload() {
        const configs = [
            { zone: 'kaipiaoZone', card: 'kaipiaoCard', input: 'kaipiaoInput', info: 'kaipiaoInfo', name: 'kaipiaoName', meta: 'kaipiaoMeta', dataKey: 'kaipiao' },
            { zone: 'jinxiaoZone', card: 'jinxiaoCard', input: 'jinxiaoInput', info: 'jinxiaoInfo', name: 'jinxiaoName', meta: 'jinxiaoMeta', dataKey: 'jinxiao' }
        ];
        configs.forEach(cfg => {
            const zoneEl = document.getElementById(cfg.zone);
            const cardEl = document.getElementById(cfg.card);
            const inputEl = document.getElementById(cfg.input);
            zoneEl.addEventListener('click', () => inputEl.click());
            zoneEl.addEventListener('dragover', e => { e.preventDefault(); cardEl.classList.add('dragover'); });
            zoneEl.addEventListener('dragleave', () => cardEl.classList.remove('dragover'));
            zoneEl.addEventListener('drop', e => {
                e.preventDefault(); cardEl.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0], cfg);
            });
            inputEl.addEventListener('change', e => {
                if (e.target.files.length) handleFile(e.target.files[0], cfg);
            });
        });
    }

    function handleFile(file, cfg) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['xlsx','xls','csv'].includes(ext)) { showToast('请上传 Excel 或 CSV 文件', 'error'); return; }
        const reader = new FileReader();
        reader.onload = e => {
            try {
                let data;
                if (ext === 'csv') { data = XLSX.read(e.target.result, { type: 'string', cellDates: true }); }
                else { data = XLSX.read(e.target.result, { type: 'array' }); }
                const sheet = data.Sheets[data.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                if (cfg.dataKey === 'kaipiao') { kaipiaoData = jsonData; }
                else { jinxiaoData = jsonData; }
                document.getElementById(cfg.info).classList.add('show');
                document.getElementById(cfg.name).textContent = file.name;
                document.getElementById(cfg.meta).textContent = `共 ${jsonData.length} 行数据`;
                checkReady();
                showToast(`${file.name} 上传成功，共 ${jsonData.length} 行`, 'success');
            } catch (err) { showToast('文件解析失败: ' + err.message, 'error'); }
        };
        reader.readAsArrayBuffer(file);
    }

    function checkReady() {
        document.getElementById('analyzeBtn').disabled = !(kaipiaoData.length && jinxiaoData.length);
    }

    function clearAll() {
        kaipiaoData = []; jinxiaoData = []; analysisResult = null;
        document.getElementById('kaipiaoInfo').classList.remove('show');
        document.getElementById('jinxiaoInfo').classList.remove('show');
        document.getElementById('kaipiaoInput').value = '';
        document.getElementById('jinxiaoInput').value = '';
        document.getElementById('analyzeBtn').disabled = true;
        document.getElementById('resultsSection').style.display = 'none';
    }

    function switchTab(idx) {
        currentTab = idx;
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
    }

    // ========== 核心分析 ==========
    function extractPureName(name) {
        if (!name) return '';
        const s = String(name).replace(/\n/g, '').trim();
        const m = s.match(/^\*[^*]+\*([\s\S]+)$/);
        return m ? m[1].trim() : s;
    }

    function extractCategory(name) {
        if (!name) return '';
        const s = String(name).replace(/\n/g, '').trim();
        const m = s.match(/^\*([^*]+)\*/);
        return m ? m[1].trim() : '';
    }

    function runAnalysis() {
        if (!kaipiaoData.length || !jinxiaoData.length) { showToast('请先上传两个文件', 'error'); return; }

        const expenseKw = ['客运','机票','汽油','柴油','餐饮','住宿','运输','物流','保险','维修','广告','代理','经纪','电信','娱乐','生活服务','旅游','租赁','会展','信息系统','代理记账','预付卡','成品油','加油','服务费','票价','轿车','药品'];

        // 过滤有效进项
        const validJinxiao = jinxiaoData.filter(row => {
            const status = String(row['发票状态'] || '');
            const isPositive = String(row['是否正数发票'] || '');
            if (status.includes('红冲') && status.includes('全额')) return false;
            if (isPositive === '否') return false;
            const name = extractPureName(row['货物或应税劳务名称'] || '');
            if (expenseKw.some(kw => name.includes(kw))) return false;
            return true;
        });

        // 汇总进项 by pureName+spec
        const jinxiaoMap = {};
        const jinxiaoByName = {};
        validJinxiao.forEach(row => {
            const rawName = String(row['货物或应税劳务名称'] || '');
            const pureName = extractPureName(rawName);
            const category = extractCategory(rawName);
            const spec = String(row['规格型号'] || '').trim();
            const amount = parseFloat(row['金额']) || 0;
            const key = `${pureName}|${spec}`;
            if (!jinxiaoMap[key]) {
                jinxiaoMap[key] = { name: pureName, category, spec, totalAmount: 0, products: [] };
            }
            jinxiaoMap[key].totalAmount += amount;
            jinxiaoMap[key].products.push(row);
            if (!jinxiaoByName[pureName]) {
                jinxiaoByName[pureName] = { name: pureName, category, totalAmount: 0, specs: [] };
            }
            jinxiaoByName[pureName].totalAmount += amount;
            jinxiaoByName[pureName].specs.push(jinxiaoMap[key]);
        });

        // 按分类汇总进项
        const jinxiaoByCategory = {};
        Object.values(jinxiaoMap).forEach(jx => {
            const cat = jx.category || '未分类';
            if (!jinxiaoByCategory[cat]) jinxiaoByCategory[cat] = [];
            jinxiaoByCategory[cat].push(jx);
        });

        // 处理开票清单 - 逐行保留
        const kaipiaoItems = kaipiaoData.map(row => {
            const rawName = row['产品名'] || row['货物或应税劳务名称'] || '';
            const name = extractPureName(rawName);
            const category = extractCategory(rawName);
            const spec = String(row['规格型号'] || '').trim();
            const qty = parseFloat(row['数量']) || 0;
            const price = parseFloat(row['单价']) || 0;
            const amount = parseFloat(row['金额']) || 0;
            return { originalName: rawName, pureName: name, category, spec, quantity: qty, price, amount };
        });

        // 汇总开票 by pureName+spec（用于匹配）
        const kaipiaoByProduct = {};
        kaipiaoItems.forEach(item => {
            const key = `${item.pureName}|${item.spec}`;
            if (!kaipiaoByProduct[key]) {
                kaipiaoByProduct[key] = { pureName: item.pureName, category: item.category, spec: item.spec, totalAmount: 0, count: 0, items: [] };
            }
            kaipiaoByProduct[key].totalAmount += item.amount;
            kaipiaoByProduct[key].count++;
            kaipiaoByProduct[key].items.push(item);
        });

        // ========== 三级匹配 ==========
        const highConfidence = [];
        const mediumConfidence = [];
        const lowConfidence = [];
        const usedJinxiaoKeys = new Set();

        // 辅助：检查是否已匹配
        function isAlreadyMatched(pureName, spec) {
            return [...highConfidence, ...mediumConfidence, ...lowConfidence].some(m => m.pureName === pureName && m.spec === spec);
        }

        // 第一轮：别名匹配
        Object.entries(aliasMap).forEach(([aliasKey, jxKey]) => {
            const [aliasName, aliasSpec] = aliasKey.split('|');
            const [jxName, jxSpec] = jxKey.split('|');
            Object.values(kaipiaoByProduct).forEach(item => {
                if (item.pureName === aliasName && item.spec === aliasSpec) {
                    const matchKey = `${jxName}|${jxSpec}`;
                    if (jinxiaoMap[matchKey] && !usedJinxiaoKeys.has(matchKey)) {
                        highConfidence.push({ ...item, matchType: 'alias', confidence: 'high', matchedJinxiao: jinxiaoMap[matchKey], jinxiaoKey: matchKey });
                        usedJinxiaoKeys.add(matchKey);
                    }
                }
            });
        });

        // 第二轮：精确匹配（品名+规格完全一致）
        Object.values(kaipiaoByProduct).forEach(item => {
            if (isAlreadyMatched(item.pureName, item.spec)) return;
            const exactKey = `${item.pureName}|${item.spec}`;
            if (jinxiaoMap[exactKey] && !usedJinxiaoKeys.has(exactKey)) {
                highConfidence.push({ ...item, matchType: 'exact', confidence: 'high', matchedJinxiao: jinxiaoMap[exactKey], jinxiaoKey: exactKey });
                usedJinxiaoKeys.add(exactKey);
            }
        });

        // 第三轮：品名相同规格不同 → 中可信
        Object.values(kaipiaoByProduct).forEach(item => {
            if (isAlreadyMatched(item.pureName, item.spec)) return;
            if (jinxiaoByName[item.pureName]) {
                const availableSpec = jinxiaoByName[item.pureName].specs.find(s => !usedJinxiaoKeys.has(`${s.name}|${s.spec}`));
                if (availableSpec) {
                    const matchKey = `${availableSpec.name}|${availableSpec.spec}`;
                    mediumConfidence.push({ ...item, matchType: 'name_match_spec_diff', confidence: 'medium', matchedJinxiao: jinxiaoMap[matchKey], jinxiaoKey: matchKey, matchDetail: `品名相同，进项规格: ${availableSpec.spec || '无'}` });
                    usedJinxiaoKeys.add(matchKey);
                }
            }
        });

        // 第四轮：模糊匹配 - 子串包含/去修饰词/关键词重叠 → 中可信
        function fuzzyScore(salesName, purchaseName) {
            const clean = s => s.replace(/[\s（）()\[\]【】]/g, '').replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').replace(/【[^】]*】/g, '');
            const s = clean(salesName), p = clean(purchaseName);
            if (s === p) return { score: 100, method: '完全相同' };
            if (s.length >= 2 && p.length >= 2) {
                if (p.includes(s)) return { score: 75, method: '进项包含销项品名' };
                if (s.includes(p)) return { score: 70, method: '销项包含进项品名' };
            }
            const stripW = ['热镀锌','冷镀锌','镀锌','不锈钢','国标','加厚','加长','重型','轻型','迷你','高档','防锈'];
            let ss = s, pp = p;
            stripW.forEach(w => { ss = ss.replace(w, ''); pp = pp.replace(w, ''); });
            if (ss && pp && ss === pp) return { score: 65, method: '去修饰词后相同' };
            if (ss.length >= 2 && pp.length >= 2) {
                if (pp.includes(ss)) return { score: 60, method: '去修饰词后包含' };
                if (ss.includes(pp)) return { score: 58, method: '去修饰词后包含' };
            }
            const sW = (s.match(/[\u4e00-\u9fffA-Za-z0-9°Φφ]+/g) || []).filter(w => w.length >= 2);
            const pW = (p.match(/[\u4e00-\u9fffA-Za-z0-9°Φφ]+/g) || []).filter(w => w.length >= 2);
            if (sW.length > 0 && pW.length > 0) {
                const common = sW.filter(w => pW.includes(w));
                const overlap = common.length / Math.max(sW.length, pW.length);
                if (overlap >= 0.6) return { score: 55, method: `关键词重叠${(overlap*100).toFixed(0)}%` };
                if (overlap >= 0.4) return { score: 45, method: `关键词重叠${(overlap*100).toFixed(0)}%` };
            }
            return null;
        }

        // 中可信模糊匹配
        Object.values(kaipiaoByProduct).forEach(item => {
            if (isAlreadyMatched(item.pureName, item.spec)) return;
            let bestMatch = null, bestScore = 0, bestKey = null, bestMethod = '';
            Object.entries(jinxiaoMap).forEach(([jxKey, jxData]) => {
                if (usedJinxiaoKeys.has(jxKey)) return;
                const f = fuzzyScore(item.pureName, jxData.name);
                if (f && f.score > bestScore) { bestScore = f.score; bestMatch = jxData; bestKey = jxKey; bestMethod = f.method; }
            });
            if (bestMatch && bestScore >= 45) {
                mediumConfidence.push({ ...item, matchType: 'fuzzy', confidence: 'medium', matchedJinxiao: bestMatch, jinxiaoKey: bestKey, matchDetail: bestMethod, fuzzyScore: bestScore });
                usedJinxiaoKeys.add(bestKey);
            }
        });

        // 第五轮：低可信 - 同分类 + 任意关键词重叠（甚至1个字）
        // 提取关键词（包括单字中文词）
        function extractKeywords(name) {
            const clean = name.replace(/[\s（）()\[\]【】0-9°Φφ#*·\-/\\]/g, '');
            const words = clean.match(/[\u4e00-\u9fffA-Za-z]+/g) || [];
            // 对中文再拆成2字组合
            const bigrams = [];
            for (const w of words) {
                if (/^[\u4e00-\u9fff]+$/.test(w) && w.length >= 2) {
                    for (let i = 0; i < w.length - 1; i++) bigrams.push(w.substring(i, i+2));
                }
                bigrams.push(w);
            }
            return [...new Set(bigrams)];
        }

        Object.values(kaipiaoByProduct).forEach(item => {
            if (isAlreadyMatched(item.pureName, item.spec)) return;
            let bestMatch = null, bestScore = 0, bestKey = null, bestMethod = '';

            // 先在同分类下找
            const itemCat = item.category || extractCategory(item.originalName || '');
            const searchPool = itemCat && jinxiaoByCategory[itemCat]
                ? jinxiaoByCategory[itemCat]
                : Object.values(jinxiaoMap);

            searchPool.forEach(jxData => {
                const jxKey = `${jxData.name}|${jxData.spec}`;
                if (usedJinxiaoKeys.has(jxKey)) return;

                const sKw = extractKeywords(item.pureName);
                const pKw = extractKeywords(jxData.name);
                const common = sKw.filter(w => pKw.includes(w) && w.length >= 2);
                const singleCommon = sKw.filter(w => pKw.includes(w) && w.length >= 1);

                let score = 0, method = '';
                const sameCat = (itemCat && jxData.category && itemCat === jxData.category);
                if (common.length >= 2) {
                    score = sameCat ? 35 : 30;
                    method = `同分类+${common.length}个共同词`;
                } else if (common.length >= 1) {
                    score = sameCat ? 25 : 20;
                    method = `${sameCat ? '同分类+' : ''}共同词: ${common.join(',')}`;
                } else if (sameCat && singleCommon.length >= 2) {
                    score = 18;
                    method = `同分类+字面相关`;
                } else if (sameCat) {
                    score = 10;
                    method = '仅同分类';
                }

                if (score > bestScore) { bestScore = score; bestMatch = jxData; bestKey = jxKey; bestMethod = method; }
            });

            // 如果同分类没找到，在全量里找任意关键词重叠
            if (!bestMatch) {
                Object.entries(jinxiaoMap).forEach(([jxKey, jxData]) => {
                    if (usedJinxiaoKeys.has(jxKey)) return;
                    const sKw = extractKeywords(item.pureName);
                    const pKw = extractKeywords(jxData.name);
                    const common = sKw.filter(w => pKw.includes(w) && w.length >= 2);
                    if (common.length >= 1 && 15 > bestScore) {
                        bestScore = 15; bestMatch = jxData; bestKey = jxKey; bestMethod = `共同词: ${common.join(',')}`;
                    }
                });
            }

            if (bestMatch) {
                lowConfidence.push({ ...item, matchType: 'low_fuzzy', confidence: 'low', matchedJinxiao: bestMatch, jinxiaoKey: bestKey, matchDetail: bestMethod, fuzzyScore: bestScore });
                usedJinxiaoKeys.add(bestKey);
            } else {
                lowConfidence.push({ ...item, matchType: 'none', confidence: 'low', matchedJinxiao: null, matchDetail: '无任何匹配进项' });
            }
        });

        // 生成待确认建议（中可信模糊 + 低可信有匹配的）
        const suggestions = [];
        [...mediumConfidence.filter(m => m.matchType === 'fuzzy'), ...lowConfidence.filter(l => l.matchType === 'low_fuzzy')].forEach(item => {
            suggestions.push({ item, suggestion: item.matchedJinxiao, score: item.fuzzyScore || 0, method: item.matchDetail || '' });
        });

        // 剩余进项
        const availableJinxiao = [];
        Object.entries(jinxiaoMap).forEach(([key, jx]) => {
            if (!usedJinxiaoKeys.has(key)) availableJinxiao.push(jx);
        });

        // 开票建议 - 按原始清单逐行
        const allMatchedMap = {};
        [...highConfidence, ...mediumConfidence, ...lowConfidence].forEach(m => {
            allMatchedMap[`${m.pureName}|${m.spec}`] = m;
        });

        const kaipiaoAdvices = kaipiaoItems.map(item => {
            const key = `${item.pureName}|${item.spec}`;
            const matched = allMatchedMap[key];
            const minRequired = item.amount / 1.185;
            let status, statusText, gap = 0, matchedName = '', matchedSpec = '', matchedAmount = 0, confidence = 'none', matchType = 'none', matchDetail = '';

            if (matched && matched.matchedJinxiao) {
                matchedName = matched.matchedJinxiao.name;
                matchedSpec = matched.matchedJinxiao.spec;
                matchedAmount = matched.matchedJinxiao.totalAmount;
                confidence = matched.confidence;
                matchType = matched.matchType;
                matchDetail = matched.matchDetail || '';
                if (matchedAmount >= minRequired) {
                    status = confidence === 'high' ? 'success' : confidence === 'medium' ? 'success' : 'warning';
                    statusText = confidence === 'high' ? '✅ 可开' : confidence === 'medium' ? '⚠️ 可开(中可信)' : '⚠️ 可开(低可信)';
                } else {
                    gap = minRequired - matchedAmount;
                    status = confidence === 'low' ? 'danger' : 'warning';
                    statusText = gap > minRequired * 0.5 ? '❌ 进项严重不足' : '⚠️ 进项不足';
                }
            } else {
                status = 'danger';
                statusText = '❌ 无进项';
                gap = minRequired;
            }

            return {
                originalName: item.originalName || item.pureName,
                pureName: item.pureName,
                spec: item.spec,
                quantity: item.quantity,
                price: item.price,
                amount: item.amount,
                minRequired,
                matchedName,
                matchedSpec,
                matchedAmount,
                confidence,
                matchType,
                matchDetail,
                status,
                statusText,
                gap
            };
        });

        // 按状态排序
        const statusOrder = { danger: 0, warning: 1, success: 2 };
        kaipiaoAdvices.sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

        // 汇总
        const highAmount = highConfidence.reduce((s, i) => s + i.totalAmount, 0);
        const mediumAmount = mediumConfidence.reduce((s, i) => s + i.totalAmount, 0);
        const lowAmount = lowConfidence.reduce((s, i) => s + i.totalAmount, 0);
        const totalAmount = kaipiaoItems.reduce((s, i) => s + i.amount, 0);

        analysisResult = {
            totalItems: kaipiaoItems.length, totalAmount,
            highCount: highConfidence.length, highAmount,
            mediumCount: mediumConfidence.length, mediumAmount,
            lowCount: lowConfidence.length, lowAmount,
            highConfidence, mediumConfidence, lowConfidence,
            suggestions,
            availableJinxiao,
            kaipiaoAdvices
        };

        document.getElementById('highBadge').textContent = highConfidence.length;
        document.getElementById('mediumBadge').textContent = mediumConfidence.length;
        document.getElementById('lowBadge').textContent = lowConfidence.length;
        document.getElementById('suggestBadge').textContent = suggestions.length;

        document.getElementById('tab0').innerHTML = renderOverview();
        document.getElementById('tab1').innerHTML = renderConfidenceTable(highConfidence, '高', '🟢');
        document.getElementById('tab2').innerHTML = renderConfidenceTable(mediumConfidence, '中', '🟡');
        document.getElementById('tab3').innerHTML = renderConfidenceTable(lowConfidence, '低', '🔴');
        document.getElementById('tab4').innerHTML = renderSuggestions();
        document.getElementById('tab5').innerHTML = renderAvailable();
        document.getElementById('tab6').innerHTML = renderAliasTable();
        document.getElementById('tab7').innerHTML = renderAdvices();

        document.getElementById('resultsSection').style.display = 'block';
        currentTab = 0;
        switchTab(0);
        showToast(`分析完成！高可信${highConfidence.length} 中可信${mediumConfidence.length} 低可信${lowConfidence.length}`, 'success');
    }

                        <span style="min-width:80px;text-align:right;font-weight:600">¥${formatMoney(r.highAmount)} (${pct(r.highAmount)}%)</span>

                        <span style="width:80px;color:#f59e0b;font-weight:600">🟡 中可信</span>
                        <div style="flex:1;height:24px;background:#e2e8f0;border-radius:12px;overflow:hidden"><div style="height:100%;width:${pct(r.mediumAmount)}%;background:#f59e0b;border-radius:12px;transition:width 0.5s"></div></div>
                        <span style="min-width:80px;text-align:right;font-weight:600">¥${formatMoney(r.mediumAmount)} (${pct(r.mediumAmount)}%)</span>

                        <span style="min-width:80px;text-align:right;font-weight:600">¥${formatMoney(r.lowAmount)} (${pct(r.lowAmount)}%)</span>
                    </div>

                <p style="color:#64748b;font-size:13px;margin-top:12px">毛利按18.5%计算，进项金额 ≥ 销售金额÷1.185 即算够开</p>
            </div>`;
    }

    function renderConfidenceTable(items, confidence, emoji) {
        if (!items.length) return `<div class="empty-state"><div class="icon">${emoji}</div><div>暂无${confidence}可信匹配</div></div>`;
        const isHigh = confidence === '高';
        return `
            <div class="card">
                <div class="card-header"><span class="card-title">${emoji} ${confidence}可信匹配</span><span>${items.length} 个产品</span></div>
                <div class="scrollable-table">
                    <table>
                        <thead><tr><th>匹配方式</th><th>原品名</th><th>规格</th><th>匹配进项品名</th><th>进项规格</th><th>销项金额</th><th>进项金额</th>${isHigh ? '' : '<th>匹配说明</th>'}<th>够开?</th></tr></thead>
                        <tbody>
                            ${items.map(item => {
                                const minReq = item.totalAmount / 1.185;
                                const enough = item.matchedJinxiao && item.matchedJinxiao.totalAmount >= minReq;
                                const ml = item.matchType === 'exact' ? '精确' : item.matchType === 'alias' ? '别名' : item.matchType === 'name_match_spec_diff' ? '品名同' : '模糊';
                                const tagClass = (item.matchType === 'exact' || item.matchType === 'alias') ? 'tag-success' : item.matchType === 'name_match_spec_diff' ? 'tag-info' : 'tag-warning';
                                let row = `<tr>
                                    <td><span class="tag ${tagClass}">${ml}</span></td>
                                    <td><strong>${item.pureName}</strong></td>
                                    <td>${item.spec || '-'}</td>
                                    <td>${item.matchedJinxiao ? item.matchedJinxiao.name : '<span style="color:#ef4444">无</span>'}</td>
                                    <td>${item.matchedJinxiao ? (item.matchedJinxiao.spec || '-') : '-'}</td>
                                    <td class="money">${formatMoney(item.totalAmount)}</td>
                                    <td class="money" style="color:${enough ? '#10b981' : '#ef4444'}">${item.matchedJinxiao ? formatMoney(item.matchedJinxiao.totalAmount) : '0.00'}</td>`;
                                if (!isHigh) row += `<td style="color:#64748b;font-size:12px">${item.matchDetail || '-'}</td>`;
                                row += `<td><span class="tag tag-${enough ? 'success' : 'danger'}">${enough ? '✅' : '❌'}</span></td></tr>`;
                                return row;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
    }

        const r = analysisResult;
        if (!r.suggestions.length) return '<div class="empty-state"><div class="icon">🤔</div><div>暂无待确认建议</div></div>';
        return `
            <div class="card">
                <div class="card-header"><span class="card-title">🤔 待确认匹配建议</span><span>确认后自动存入别名表并重新分析</span></div>
                <div class="scrollable-table">
                    <table>
                        <thead><tr><th>销项品名</th><th>规格</th><th>建议进项品名</th><th>进项规格</th><th>匹配说明</th><th>操作</th></tr></thead>
                        <tbody>
                            ${r.suggestions.map((s, i) => `<tr>
                                <td><strong>${s.item.pureName}</strong></td>
                                <td>${s.item.spec || '-'}</td>
                                <td>${s.suggestion.name}</td>
                                <td>${s.suggestion.spec || '-'}</td>
                                <td><span class="tag tag-warning">${s.method}</span></td>
                                <td>

                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
    }

    function confirmSuggestion(idx) {
        const s = analysisResult.suggestions[idx];
        aliasMap[`${s.item.pureName}|${s.item.spec}`] = `${s.suggestion.name}|${s.suggestion.spec}`;
        localStorage.setItem('kaipiao_alias_map', JSON.stringify(aliasMap));
        showToast('已确认，自动重新分析', 'success');
        runAnalysis();
    }

    function ignoreSuggestion(idx) {
        analysisResult.suggestions.splice(idx, 1);
        showToast('已忽略', 'info');
        document.getElementById('tab4').innerHTML = renderSuggestions();
        document.getElementById('suggestBadge').textContent = analysisResult.suggestions.length;
    }

    function renderAvailable() {
        const r = analysisResult;
        if (!r.availableJinxiao.length) return '<div class="empty-state"><div class="icon">📦</div><div>暂无剩余进项</div></div>';
        return `
            <div class="card">
                <div class="card-header"><span class="card-title">📦 可用进项余额</span><span>匹配后剩余的进项</span></div>
                <div class="scrollable-table">
                    <table>
                        <thead><tr><th>产品名</th><th>规格</th><th>剩余金额</th><th>发票数</th></tr></thead>
                        <tbody>${r.availableJinxiao.map(jx => `<tr>
                            <td>${jx.name}</td><td>${jx.spec || '-'}</td>
                            <td class="money" style="color:var(--success)">${formatMoney(jx.totalAmount)}</td>
                            <td>${jx.products.length}</td></tr>`).join('')}</tbody>
                    </table>
                </div>
            </div>`;
    }

    function renderAliasTable() {
        const entries = Object.entries(aliasMap);
        if (!entries.length) return '<div class="empty-state"><div class="icon">🔗</div><div>暂无保存的别名</div></div>';
        return `
            <div class="card">
                <div class="card-header"><span class="card-title">🔗 已确认的别名</span><span>${entries.length} 条</span></div>
                ${entries.map(([key, value]) => {
                    const [n, s] = key.split('|'); const [jn, js] = value.split('|');
                    return `<div class="alias-item"><div><strong>${n}</strong>${s ? `<small style="color:#64748b"> (${s})</small>` : ''}</div><span class="arrow">→</span><div><strong>${jn}</strong>${js ? `<small style="color:#64748b"> (${js})</small>` : ''}</div><button class="btn btn-danger btn-sm" onclick="deleteAlias('${key}')">删除</button></div>`;
                }).join('')}
                <div style="margin-top:16px;text-align:center"><button class="btn btn-danger" onclick="clearAllAlias()">清空所有别名</button></div>
            </div>`;

    function deleteAlias(key) {
        delete aliasMap[key];
        localStorage.setItem('kaipiao_alias_map', JSON.stringify(aliasMap));
        showToast('已删除', 'success');
        runAnalysis();
    }

    function clearAllAlias() {
        if (!confirm('确定清空所有别名？')) return;
        aliasMap = {};
        localStorage.setItem('kaipiao_alias_map', JSON.stringify(aliasMap));
        showToast('已清空', 'success');
        runAnalysis();
    }

    function renderAdvices() {
        const r = analysisResult;
        if (!r.kaipiaoAdvices.length) return '<div class="empty-state"><div class="icon">📋</div><div>请先分析</div></div>';
        return `
            <div class="card">
                <div class="card-header"><span class="card-title">📋 开票建议</span><span>按紧急程度排序 · 与原始清单金额一致</span></div>
                <div class="scrollable-table">
                    <table>
                        <thead><tr><th>状态</th><th>原品名</th><th>规格</th><th>数量</th><th>单价</th><th>金额</th><th>替代进项品名</th><th>进项规格</th><th>进项金额</th><th>可信度</th><th>匹配说明</th><th>需补进项</th></tr></thead>
                        <tbody>
                            ${r.kaipiaoAdvices.map(a => {

                                if (a.status === 'danger') rowClass = 'error-row';
                                else if (a.status === 'warning') rowClass = 'highlight-row';
                                else rowClass = 'success-row';
                                const confTag = a.confidence === 'high' ? '<span class="tag tag-success">高</span>' : a.confidence === 'medium' ? '<span class="tag tag-warning">中</span>' : '<span class="tag tag-danger">低</span>';
                                return `<tr class="${rowClass}">
                                    <td><span class="tag tag-${a.status === 'success' ? 'success' : a.status === 'danger' ? 'danger' : 'warning'}">${a.statusText}</span></td>

                    </table>

            </div>`;
    }

    async function exportAll() {
        if (!analysisResult) return;
        const wb = new ExcelJS.Workbook();
        wb.creator = '张洪杰'; wb.created = new Date();
        const headerStyle = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
        const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0891B2' } };

        function addSheet(name, headers, rows) {
            const ws = wb.addWorksheet(name);
            headers.forEach((h, i) => { const c = ws.getCell(1, i+1); c.value = h; c.font = headerStyle; c.fill = headerFill; c.alignment = { horizontal: 'center' }; c.border = { style: 'thin', color: { argb: 'FFD0D0D0' } }; });
            rows.forEach((row, ri) => {
                row.forEach((val, ci) => { const c = ws.getCell(ri+2, ci+1); c.value = val; c.border = { style: 'thin', color: { argb: 'FFD0D0D0' } }; if (typeof val === 'number') c.numFmt = '#,##0.00'; });
            });
            ws.columns.forEach(col => col.width = 18);
        }

        const r = analysisResult;
        addSheet('匹配概览', ['项目','数量','金额'], [
            ['高可信', r.highCount, r.highAmount], ['中可信', r.mediumCount, r.mediumAmount],
            ['低可信', r.lowCount, r.lowAmount], ['合计', r.totalItems, r.totalAmount]
        ]);

        const allMatched = [...r.highConfidence, ...r.mediumConfidence, ...r.lowConfidence];
        addSheet('全部匹配', ['可信度','匹配方式','原品名','规格','匹配进项品名','进项规格','销项金额','进项金额','匹配说明'],
            allMatched.map(m => [m.confidence === 'high' ? '高' : m.confidence === 'medium' ? '中' : '低',
                m.matchType === 'exact' ? '精确' : m.matchType === 'alias' ? '别名' : m.matchType === 'name_match_spec_diff' ? '品名同' : '模糊',
                m.pureName, m.spec || '', m.matchedJinxiao ? m.matchedJinxiao.name : '无', m.matchedJinxiao ? (m.matchedJinxiao.spec || '') : '',
                m.totalAmount, m.matchedJinxiao ? m.matchedJinxiao.totalAmount : 0, m.matchDetail || '']));

        addSheet('开票建议', ['状态','原品名','规格','数量','单价','金额','替代进项品名','进项规格','进项金额','可信度','匹配说明','需补进项'],
            r.kaipiaoAdvices.map(a => [a.statusText, a.pureName, a.spec || '', a.quantity, a.price, a.amount,
                a.matchedName || '无', a.matchedSpec || '', a.matchedAmount, a.confidence === 'high' ? '高' : a.confidence === 'medium' ? '中' : '低',
                a.matchDetail || '', a.gap > 0 ? a.gap : 0]));

        const buffer = await wb.xlsx.writeBuffer();
        saveAs(new Blob([buffer]), `开票建议_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.xlsx`);
        showToast('导出成功！', 'success');
    }

    function exportTableToExcel(table, sheetName) {
        if (!table) { showToast('无数据', 'error'); return; }
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet(sheetName);
        const headers = [];
        table.querySelectorAll('thead th').forEach((th, i) => {
            headers.push(th.textContent.trim());
            const c = ws.getCell(1, i+1); c.value = th.textContent.trim();
            c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0891B2' } };
        });
        table.querySelectorAll('tbody tr').forEach((tr, ri) => {
            tr.querySelectorAll('td').forEach((td, ci) => {
                const c = ws.getCell(ri+2, ci+1);
                const text = td.textContent.trim();
                const num = parseFloat(text.replace(/[,¥￥$\s\-]/g, ''));
                if (!isNaN(num) && text.match(/^[\d,.¥￥]/)) { c.value = num; c.numFmt = '#,##0.00'; }
                else c.value = text;
            });
        });
        ws.columns.forEach(col => col.width = 18);
        wb.xlsx.writeBuffer().then(buf => {
            saveAs(new Blob([buf]), `${sheetName}_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.xlsx`);
            showToast('导出成功！', 'success');
        });
    }

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        setupUpload();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    });
</script>
